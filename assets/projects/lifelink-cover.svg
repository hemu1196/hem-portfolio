<text x="935" y="385" fill="#fff" font-family="Arial" font-size="76" font-weight="bold">LifeLink<tspan fill="#c6e77b">.</tspan></text>
<text x="935" y="440" fill="#f4f5eb" font-family="Arial" font-size="25" font-weight="bold">When every second counts, better software matters.</text>
<text x="935" y="490" fill="#bdc9c0" font-family="Arial" font-size="19">An emergency blood coordination system connecting donors,</text>
<text x="935" y="520" fill="#bdc9c0" font-family="Arial" font-size="19">hospitals and blood banks. Features role-based experiences, request</text>
<text x="935" y="550" fill="#bdc9c0" font-family="Arial" font-size="19">management, donor matching logic and inventory workflows.</text>
